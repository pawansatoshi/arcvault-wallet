name: ArcVault Release Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply security and correctness hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Server-side API authorization.
          api_dir = Path('api')
          for p in api_dir.glob('*.js'):
              if p.name == '_auth.js':
                  continue
              s = p.read_text()
              if "from './_auth.js'" not in s:
                  s = "import { requireAuth, requireOwnedWallet, authError } from './_auth.js';\n" + s
              marker = 'export default async function handler(req, res) {'
              if marker in s and 'const __authResult = await requireAuth(req)' not in s:
                  guard = '''export default async function handler(req, res) {
    if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed.' });
    let __authResult;
    try { __authResult = await requireAuth(req); } catch (e) { return authError(res, e); }
'''
                  s = s.replace(marker, guard, 1)
              p.write_text(s)

          # Wallet creation is always bound to the Firebase UID and Circle refId.
          p = api_dir / 'wallet.js'
          s = p.read_text()
          s = s.replace('const { userId } = req.body;', 'const userId = __authResult.uid;')
          s = s.replace('accountType: "EOA"', 'accountType: "EOA",\n            refId: userId')
          p.write_text(s)

          # Privileged operations must prove wallet ownership before calling Circle.
          for name in ['balance.js', 'transfer.js', 'approve.js', 'swap.js']:
              p = api_dir / name
              s = p.read_text()
              if 'requireOwnedWallet' not in s:
                  # Existing auth import already exists; this marker is replaced below.
                  pass
              if name == 'balance.js':
                  s = s.replace('const { walletId } = req.body;', 'const { walletId } = req.body;\n    try { await requireOwnedWallet(req, walletId); } catch (e) { return authError(res, e); }')
              else:
                  s = s.replace('const { walletId,', 'const { walletId,')
                  marker = 'const { walletId,'
                  if marker in s and 'requireOwnedWallet(req, walletId)' not in s:
                      start = s.index(marker)
                      line_end = s.index(';', start) + 1
                      s = s[:line_end] + '\n    try { await requireOwnedWallet(req, walletId); } catch (e) { return authError(res, e); }' + s[line_end:]
              p.write_text(s)

          # Faucet must be tied to the authenticated wallet; never accept an arbitrary payout address.
          p = api_dir / 'faucet.js'
          s = p.read_text()
          s = s.replace('const { destinationAddress } = req.body;\n    if (!destinationAddress) return res.status(400).json({ success: false, error: "Destination required." });',
                        'const { walletId } = req.body;\n    let __owned;\n    try { __owned = await requireOwnedWallet(req, walletId); } catch (e) { return authError(res, e); }\n    const destinationAddress = __owned.wallet.address;')
          p.write_text(s)

          # Remove the client-side deterministic "master key" impersonation path.
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'window\.downloadMasterKey = \(\) => \{.*?\n        \};\n        window\.processRecovery = async? \(\) => \{.*?\n        \};', '''window.downloadMasterKey = () => {
            showError("Recovery Safety", "Client-generated recovery strings are not wallet credentials. Use your linked Firebase sign-in provider to recover access.", "ERR-RECOVERY-DISABLED");
        };
        window.processRecovery = () => {
            showError("Recovery Disabled", "This build does not accept client-generated recovery keys. Authenticate with a linked provider instead.", "ERR-RECOVERY-DISABLED");
        };''', s, flags=re.S)

          # Never claim a WalletConnect session from a UI-only simulation.
          s = re.sub(r'window\.simulateWalletConnect = \(\) => \{.*?\n        \};', '''window.simulateWalletConnect = () => {
            document.getElementById('wc-action-bar').classList.add('hidden');
            showError("WalletConnect Not Configured", "A QR URI can be detected, but this build does not contain a real WalletConnect session engine. No wallet session was approved.", "ERR-WC-NOT-CONFIGURED");
        };''', s, flags=re.S)

          # Never call a self-transfer and label it a bridge. Keep the UI as an explicit pending integration.
          s = re.sub(r'window\.executeBridge = async \(\) => \{.*?\n        \};', '''window.executeBridge = async () => {
            showError("Bridge Unavailable", "The bridge surface is disabled until a verified CCTP integration is connected. No assets were moved.", "ERR-BRIDGE-DISABLED");
        };''', s, flags=re.S)

          # Client API requests automatically carry the Firebase ID token.
          anchor = 'const db = getFirestore(app);'
          if 'window.__arcvaultApiFetchInstalled' not in s and anchor in s:
              injection = '''
        if (!window.__arcvaultApiFetchInstalled) {
            window.__arcvaultApiFetchInstalled = true;
            const __nativeFetch = window.fetch.bind(window);
            window.fetch = async (input, init = {}) => {
                const url = typeof input === 'string' ? input : input?.url || '';
                if (url.startsWith('/api/')) {
                    const user = auth.currentUser;
                    if (user) {
                        const token = await user.getIdToken();
                        const headers = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined));
                        headers.set('Authorization', `Bearer ${token}`);
                        init = { ...init, headers };
                    }
                }
                return __nativeFetch(input, init);
            };
        }
'''
              s = s.replace(anchor, anchor + injection, 1)

          # Faucet requests now send the wallet ID rather than an arbitrary destination address.
          s = s.replace('body: JSON.stringify({ destinationAddress: document.getElementById(\'wallet-address\').innerText })',
                        'body: JSON.stringify({ walletId: wId })')

          # Correct the Arc-native gas semantics in visible labels/comments where the app previously implied ERC-20 precision.
          s = s.replace('strict 6-decimal input masking (to prevent 18-decimal gas errors)', '6-decimal display formatting with separate native-gas precision')
          s = s.replace('const estGas = 0.002;', 'const estGas = 0.002; // human-readable USDC estimate; Circle handles native precision server-side')

          p.write_text(s)
          PY

      - name: Validate syntax and configuration
        run: |
          node --check api/_auth.js
          for f in api/*.js; do node --check "$f"; done
          python3 - <<'PY'
          import json
          for f in ['package.json', 'manifest.json', 'vercel.json']:
              with open(f) as fh: json.load(fh)
          print('configuration: valid')
          PY

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No additional hardening changes required"
          else
            git add index.html api vercel.json package.json manifest.json
            git commit -m "fix: harden ArcVault testnet release"
            git push
          fi
